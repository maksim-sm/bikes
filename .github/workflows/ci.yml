name: CI

on:
  pull_request:
  push:
    branches: [main]

# A green workflow means every critical job succeeded. The `gate` job fails
# if lint, types, unit, integration, build, e2e, or the dependency audit
# was skipped or failed (ADR-0044).
jobs:
  audit:
    name: Security / dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Refuse skipped or missing suites
        run: pnpm ci:assert-tests
      - name: Production dependency audit
        run: pnpm audit:deps

  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bikes
          POSTGRES_PASSWORD: bikes
          POSTGRES_DB: bikes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikes -d bikes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bikes:bikes@localhost:5432/bikes
      TEST_DATABASE_URL: postgresql://bikes:bikes@localhost:5432/bikes_test
      TEST_DATABASE_ADMIN_URL: postgresql://bikes:bikes@localhost:5432/postgres
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Reproduce schema from migrations
        run: pnpm db:reproduce
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e

  gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [audit, check, e2e]
    steps:
      - name: Require every critical job
        env:
          AUDIT: ${{ needs.audit.result }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "audit=$AUDIT check=$CHECK e2e=$E2E"
          test "$AUDIT" = success
          test "$CHECK" = success
          test "$E2E" = success
