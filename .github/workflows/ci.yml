name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Типы, линт, формат
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Проверка типов
        run: pnpm typecheck
      - name: Линтер
        run: pnpm lint
      - name: Формат
        run: pnpm format:check

  unit:
    name: Unit и компонентные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Vitest с покрытием
        run: pnpm test
      - name: Сохранить отчёт о покрытии
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production-сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Кеш сборки Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Сборка
        run: pnpm build

  e2e:
    name: Playwright (smoke и полный набор)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Установить браузеры Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      # Playwright сам собирает и запускает приложение (см. webServer в playwright.config.ts).
      - name: Smoke-набор
        run: pnpm e2e:smoke
      - name: Полный набор
        run: pnpm e2e
      - name: Сохранить отчёт Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lighthouse (сборка и 3 прогона)
        run: pnpm lighthouse
      - name: Сохранить отчёты Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  # Единая проверка для защиты ветки: в правилах main достаточно требовать только её.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [static, unit, build, e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Проверить результаты задач
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Результаты: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Есть непройденные проверки"
              exit 1
            fi
          done
