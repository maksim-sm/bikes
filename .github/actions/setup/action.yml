name: Подготовка окружения
description: Устанавливает pnpm, Node.js и зависимости по замороженному lock-файлу

runs:
  using: composite
  steps:
    - name: Установить pnpm
      uses: pnpm/action-setup@v4

    - name: Установить Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Установить зависимости
      shell: bash
      run: pnpm install --frozen-lockfile
